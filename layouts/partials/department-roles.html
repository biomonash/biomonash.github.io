<section class="department-roles">

    <!-- DEPARTMENT TITLE -->
    <h2 class="header1-txt department-roles-title">
        {{ .name }}
    </h2>


    <!-- DEPARTMENT IMAGE AND FROG -->
    <div class="department-roles-image-wrapper">

        {{ with .image }}
            <img
                class="department-roles-image"
                src="{{ . | relURL }}"
                alt="{{ $.name }} Department"
            >
        {{ end }}

        <img
            class="department-roles-frog"
            src="{{ "images/frog.png" | relURL }}"
            alt=""
            aria-hidden="true"
        >

    </div>


    <!-- ROLES HEADING -->
    <h3 class="roles-heading">
        Roles
    </h3>


    <!-- REUSABLE ORANGE TAGS -->
    {{ with .tags }}

        <div class="role-tags">

            {{ range . }}
                {{ partial "role-tag.html" . }}
            {{ end }}

        </div>

    {{ end }}


    <!-- ROLE CAROUSEL -->
    <div class="department-roles-carousel">

        <div class="roles-list">

            {{ range .roles }}

                <div class="roles-carousel-item">
                    {{ partial "role-card.html" . }}
                </div>

            {{ end }}

        </div>

    </div>


    <!-- CAROUSEL NAVIGATION -->
    {{ if gt (len .roles) 0 }}

        <div class="roles-carousel-controls">

            <button
                type="button"
                class="roles-carousel-prev"
                aria-label="Previous roles">
                &#10094;
            </button>

            <button
                type="button"
                class="roles-carousel-next"
                aria-label="Next roles">
                &#10095;
            </button>

        </div>

    {{ end }}

</section>


<!-- CAROUSEL FUNCTIONALITY -->
<script>
(function () {

    const sections = document.querySelectorAll(
        ".department-roles"
    );

    sections.forEach(function (section) {

        if (section.dataset.carouselReady === "true") {
            return;
        }

        section.dataset.carouselReady = "true";

        const list = section.querySelector(".roles-list");
        const previous = section.querySelector(".roles-carousel-prev");
        const next = section.querySelector(".roles-carousel-next");

        if (!list || !previous || !next) {
            return;
        }

        function getScrollAmount() {

            const card = list.querySelector(
                ".roles-carousel-item"
            );

            if (!card) {
                return 300;
            }

            const gap = parseFloat(
                window.getComputedStyle(list).columnGap
            ) || 0;

            return card.getBoundingClientRect().width + gap;
        }

        previous.addEventListener("click", function () {

            list.scrollBy({
                left: -getScrollAmount(),
                behavior: "smooth"
            });

        });

        next.addEventListener("click", function () {

            list.scrollBy({
                left: getScrollAmount(),
                behavior: "smooth"
            });

        });

    });

})();
</script>
