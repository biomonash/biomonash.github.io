<section class="executive-team">

    <!-- SECTION TITLE -->

    <h2
        class="header1-txt team-section-title"
        data-aos="fade-up"
        data-aos-duration="900"
        data-aos-offset="80">
        {{ .title }}
    </h2>

    <!-- EXECUTIVE / ADVISOR CARDS -->

    <div class="executive-grid">

        {{ range $index, $member := .members }}

            <div
                data-aos-duration="800"
                data-aos-delay="{{ mod (mul $index 100) 400 }}"
                data-aos-offset="60">

                {{ partial "person-card.html" $member }}

            </div>

        {{ end }}

    </div>

</section>
