<head>
    <!-- Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>{{ .Title }} | BiOM</title>

    <!-- Tab logo -->
    <link rel="icon" href="{{ "images/BiOM-Logo.webp" | relURL }}"
        type="image/webp">

    <!-- Color setup -->
    <style>
    :root {
      --main: #172415;
      --secondary: #b4ce1f;
      --secondary2: #dee582;
      --neutral: #fff4cf;
      --dark1: #0c2103;
      --dark2: #13330d;

      --accent1: #d38748;
      --accent2: #a74d36;
      --accent3: #0097b2;
    }
  </style>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- AOS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@next/dist/aos.css">

    <!-- Animate.css -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- Project styles -->
    <link rel="stylesheet" href="{{ "css/divs.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/header.css" | relURL }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Calistoga&family=Fredoka:wght@300..700&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
</head>
