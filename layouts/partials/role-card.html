<div class="role-flip-card">

  <button
    type="button"
    class="role-flip-inner"
    aria-label="Flip card for {{ .name }}"
    aria-pressed="false"
    onclick="
      this.classList.toggle('is-flipped');
      this.setAttribute(
        'aria-pressed',
        this.classList.contains('is-flipped')
      );
    ">

    <!-- FRONT -->

    <span class="role-flip-front">

      <span class="role-flip-title">
        {{ .name }}
      </span>

    </span>


    <!-- BACK -->

    <span class="role-flip-back">

      <span class="role-flip-details">

        <span class="role-detail-heading">
          Expected Skills:
        </span>

        {{ range .skills }}
          <span class="role-detail-item">
            • {{ . }}
          </span>
        {{ end }}

        <span class="role-detail-heading">
          Responsibilities:
        </span>

        {{ range .responsibilities }}
          <span class="role-detail-item">
            • {{ . }}
          </span>
        {{ end }}

        {{ with .description }}

          <span class="role-flip-description">
            {{ . }}
          </span>

        {{ end }}

      </span>

    </span>

  </button>

</div>
