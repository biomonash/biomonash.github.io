<div class="role-flip-card">

  <button
    type="button"
    class="role-flip-inner"
    aria-label="Flip card for {{ .name }}"
    aria-pressed="false"
    onclick="
      this.classList.toggle('is-flipped');
      this.setAttribute(
        'aria-pressed',
        this.classList.contains('is-flipped')
      );
    "
  >

    <!-- FRONT -->
    <div class="role-flip-front">
      <h3>{{ .name }}</h3>
    </div>

    <!-- BACK -->
    <div class="role-flip-back">

      <div class="role-flip-details">

        <h4>Expected Skills:</h4>

        <ul>
          {{ range .skills }}
            <li>{{ . }}</li>
          {{ end }}
        </ul>

        <h4>Responsibility:</h4>

        <ul>
          {{ range .responsibilities }}
            <li>{{ . }}</li>
          {{ end }}
        </ul>

        {{ with .description }}
          <p class="role-flip-description">
            {{ . }}
          </p>
        {{ end }}

      </div>

    </div>

  </button>

</div>
