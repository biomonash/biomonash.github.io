<!--BASIC Project Menu Page-->

<!doctype html>
<html lang="en">

  {{ partial "head.html" . }}

  <body>

    {{ partial "navbar.html" . }}

    <main class="container pb-5" style="padding-top: 110px;">



      <section id="projects" data-aos="fade-up">

        <h1 class="header1-txt">{{ .Title }}</h1>

        {{ with .Content }}
          <div class="body-txt">{{ . }}</div>
        {{ end }}

        {{ range sort .RegularPages "Title" }}
          {{ partial "home/project-card.html" . }}
        {{ end }}

      </section>

    </main>

    {{ partial "footer.html" . }}

  </body>

</html>
